<!-- no-cache -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documentation</title></head>
<body>
<main>
<h1>Documentation</h1>
{% if sources %}
<ul>{% for source in sources %}<li><a href="{{ source.url | e }}">{{ source.title | e }}</a></li>{% endfor %}</ul>
{% else %}<p>No documentation sources are available for your account on this site.</p>{% endif %}
{% if is_guest %}<p><a href="/login?redirect-to=/docs">Log in</a> to see sources that require login.</p>{% endif %}
</main>
</body>
</html>
