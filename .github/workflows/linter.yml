name: Linters
on:
  pull_request:
  push:
    branches: [version-16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: pre-commit/action@v3.0.1
      - run: npm run lint
        working-directory: frontend
      - run: python -m unittest discover -s frontend/scripts -p "test_*.py"
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
